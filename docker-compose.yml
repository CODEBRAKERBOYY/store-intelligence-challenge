services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      STORE_DB_PATH: /app/data/store_intelligence.db
      POS_CSV_PATH: "/data/Brigade_Bangalore_10_April_26 (1)bc6219c.csv"
      STORE_LAYOUT_PATH: "/data/Brigade Road - Store layoutc5f5d56.xlsx"
    volumes:
      - ./data:/app/data
      - ${DATA_DIR:-./challenge_data}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
