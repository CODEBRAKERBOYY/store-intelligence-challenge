services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      STORE_DB_PATH: /app/data/store_intelligence.db
      POS_CSV_PATH: ${POS_CSV_PATH:-/data/pos_transactions.csv}
      STORE_LAYOUT_PATH: ${STORE_LAYOUT_PATH:-/data/store_layout.json}
    volumes:
      - ./data:/app/data
      - ${DATA_DIR:-./challenge_data}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
